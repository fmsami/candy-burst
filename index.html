<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Candy Burst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen app, a winding level map and a play screen (HUD / board / booster tray). One candy-shop look in every theme. */
:root{
  --sky-a:#ff9ccf; --sky-b:#7d4fe0; --sky-c:#ffd66e;
  --panel:#fff8fc; --panel-2:#ffe7f4; --ink:#56206b; --ink-soft:#9b6bab; --line:#ffc4e3;
  --berry:#ff3f8e; --berry-deep:#b8165f; --mint:#36c46b; --mint-deep:#1d7d3e; --gold:#ffc531;
  --hud:rgba(255,248,252,.92);
  --display:'Lilita One','Fredoka',system-ui,sans-serif;
  --body:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--sky-b);background-image:radial-gradient(circle at 18% 8%,var(--sky-c) 0,transparent 32%),radial-gradient(circle at 88% 28%,var(--sky-a) 0,transparent 46%),linear-gradient(165deg,var(--sky-a),var(--sky-b));background-attachment:fixed;font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.hidden{display:none!important}

/* ---------- map ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding-block:10px;z-index:3;max-width:560px;width:100%;margin:0 auto}
.brand{font:400 26px var(--display);color:#fff;-webkit-text-stroke:2px var(--berry-deep);paint-order:stroke fill;text-shadow:0 3px 0 var(--berry-deep);letter-spacing:.5px;margin-right:auto;white-space:nowrap}
.pill{background:var(--hud);border:none;border-radius:999px;padding:7px 12px;font-weight:600;font-size:15px;box-shadow:0 3px 0 rgba(80,20,90,.18);display:flex;gap:6px;align-items:center;cursor:pointer;font-variant-numeric:tabular-nums}
.pill small{color:var(--ink-soft);font-weight:500}
.iconbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--hud);font-size:21px;box-shadow:0 3px 0 rgba(80,20,90,.18);cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--berry);border:2px solid #fff}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
#mapInner{position:relative;width:100%;max-width:560px;margin:0 auto}
#mapPath{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid #fff;font:400 24px var(--display);color:#fff;background:radial-gradient(circle at 35% 28%,#ffa6d0,var(--berry) 58%,#c4176a);box-shadow:0 5px 0 var(--berry-deep),0 10px 20px rgba(60,10,70,.3);cursor:pointer;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.node.locked{background:radial-gradient(circle at 35% 28%,#e6def0,#a497ba);box-shadow:0 5px 0 #6f6385;color:#f6f2fb;cursor:default}
.node.current{animation:bob 1.3s ease-in-out infinite;background:radial-gradient(circle at 35% 28%,#fff1a8,#ffb21f 58%,#e07800);box-shadow:0 5px 0 #a65400,0 0 0 6px rgba(255,255,255,.35),0 10px 22px rgba(60,10,70,.35)}
.node .st{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:15px;white-space:nowrap;letter-spacing:-1px;font-family:var(--body)}
.node .st b{color:var(--gold);-webkit-text-stroke:1px #a65400;text-shadow:none}
.node .st i{color:rgba(255,255,255,.6);font-style:normal;text-shadow:none}
.deco{position:absolute;pointer-events:none;opacity:.9;filter:drop-shadow(0 4px 4px rgba(60,10,70,.25))}
.world-label{position:absolute;left:50%;transform:translateX(-50%);font:400 18px var(--display);color:#fff;background:rgba(86,32,107,.35);padding:4px 14px;border-radius:999px;white-space:nowrap;letter-spacing:.5px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ---------- game ---------- */
#hud{display:flex;gap:8px;padding-block:10px 6px;align-items:stretch;max-width:640px;width:100%;margin:0 auto}
.hudbox{background:var(--hud);border-radius:18px;padding:6px 10px;box-shadow:0 4px 0 rgba(80,20,90,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;font-variant-numeric:tabular-nums}
.hudbox small{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hudbox b{font:400 26px/1 var(--display);color:var(--ink)}
.hudbox.moves b{font-size:32px;color:var(--berry)}
.hudbox.moves.low b{animation:throb .6s ease-in-out infinite}
.goals{flex:1;min-width:0;flex-direction:row;flex-wrap:wrap;gap:4px 12px}
.goal{display:flex;align-items:center;gap:4px;font:400 20px var(--display)}
.goal img{width:30px;height:30px}
.goal .em{font-size:24px}
.goal.done b{color:var(--mint)}
.starbar{position:relative;width:86px;height:9px;background:rgba(86,32,107,.15);border-radius:6px;margin-top:6px}
#starFill{height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff9f1c);border-radius:6px;transition:width .35s}
.starbar .mk{position:absolute;top:-7px;font-size:13px;transform:translateX(-50%);color:#d8c6df;line-height:1}
.starbar .mk.on{color:var(--gold);-webkit-text-stroke:.5px #a65400}
#lvLabel{font:400 13px var(--display);color:#fff;text-align:center;letter-spacing:1px;opacity:.9}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#board{display:block;touch-action:none;filter:drop-shadow(0 10px 18px rgba(50,10,70,.35))}
#bigText{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;font:400 clamp(40px,11vw,70px) var(--display);color:#fff;-webkit-text-stroke:4px #c2187a;paint-order:stroke fill;text-shadow:0 6px 0 #7a0e4d,0 12px 26px rgba(0,0,0,.35);opacity:0;letter-spacing:1px}
#bigText.sugar{color:#fff6c2;-webkit-text-stroke-color:#e07800;text-shadow:0 6px 0 #9a4a00,0 12px 26px rgba(0,0,0,.35)}
#bigText.show{animation:pop 1.15s ease-out forwards}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.18) rotate(3deg);opacity:1}32%{transform:scale(1) rotate(0)}78%{opacity:1}100%{transform:scale(1.04) translateY(-34px);opacity:0}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#boosterBar{display:flex;gap:10px;justify-content:center;padding-block:8px 12px}
.boost{position:relative;width:56px;height:56px;border-radius:18px;border:none;background:var(--hud);font-size:27px;box-shadow:0 4px 0 rgba(80,20,90,.2);cursor:pointer;transition:transform .12s}
.boost i{position:absolute;right:-5px;bottom:-5px;background:var(--berry);color:#fff;font:600 12px var(--body);border-radius:10px;padding:1px 6px;font-style:normal;border:2px solid #fff;min-width:10px}
.boost.on{outline:4px solid var(--gold);transform:translateY(-4px)}
.boost:disabled{opacity:.45;cursor:default}
.boost.menu{background:rgba(86,32,107,.45);color:#fff}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(40,10,60,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:var(--panel);border-radius:30px;padding:22px 20px 24px;width:100%;max-width:370px;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 8px 0 var(--line),0 24px 50px rgba(0,0,0,.35);text-align:center;border:4px solid #fff;box-sizing:border-box;animation:cardIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font:400 32px/1.1 var(--display);margin:4px 0 10px;color:var(--berry);text-wrap:balance}
.card h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin:16px 0 8px}
.card p{margin:8px 0;line-height:1.45}
.lvbadge{display:inline-block;font:400 15px var(--display);background:var(--berry);color:#fff;padding:5px 16px;border-radius:999px;letter-spacing:1px;box-shadow:0 3px 0 var(--berry-deep)}
.btn{font:600 18px var(--body);border:none;border-radius:999px;padding:12px 24px;color:#fff;background:linear-gradient(#ff7ab8,var(--berry));box-shadow:0 5px 0 var(--berry-deep);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--berry-deep)}
.btn.green{background:linear-gradient(#72e394,var(--mint));box-shadow:0 5px 0 var(--mint-deep)}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.big{font-size:22px;padding:14px 34px}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.btn small{font-weight:500;opacity:.85;font-size:13px}
.row{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.goal-list{display:flex;flex-direction:column;gap:8px;align-items:center}
.gl{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;padding:6px 14px 6px 8px;font-weight:600;font-size:16px}
.gl img{width:34px;height:34px}.gl .em{font-size:26px;width:34px}
.meta{color:var(--ink-soft);font-size:14px;margin-top:10px}
.tip{background:#fff3c4;color:#7a4a00;border-radius:14px;padding:10px 12px;font-size:14px;text-align:left}
.prebo{display:flex;gap:12px;justify-content:center}
.pb{position:relative;width:62px;height:62px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:28px;cursor:pointer}
.pb i{position:absolute;right:-6px;bottom:-6px;background:var(--berry);color:#fff;font:600 12px var(--body);border-radius:10px;padding:1px 6px;font-style:normal;border:2px solid #fff}
.pb.on{border-color:var(--gold);background:#fff6d6;transform:translateY(-3px);box-shadow:0 4px 0 var(--gold)}
.pb.on::after{content:'✓';position:absolute;left:-6px;top:-6px;background:var(--mint);color:#fff;width:20px;height:20px;border-radius:50%;font-size:13px;line-height:20px;font-weight:700}
.pb:disabled{opacity:.4}
.pblabel{font-size:12px;color:var(--ink-soft);margin-top:8px;min-height:16px}
.stars-big{font-size:46px;letter-spacing:4px;line-height:1;margin:6px 0}
.stars-big .s{color:#e8dcee;display:inline-block}
.stars-big .s.on{color:var(--gold);-webkit-text-stroke:2px #c77800}
.stars-big.win .s.on{animation:starIn .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
.score-big{font:400 40px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft);font-size:14px}
.reward{background:#e6fbe9;color:#1d6b36;border-radius:14px;padding:8px 12px;font-weight:600}
.bigemoji{font-size:60px;line-height:1.1}
.bag{display:flex;flex-direction:column;gap:8px;text-align:left}
.bag div{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:14px;padding:8px 12px}
.bag span{font-size:26px}.bag p{margin:0;font-size:13px;color:var(--ink-soft)}.bag b{display:block;font-size:15px;color:var(--ink)}
.bag em{margin-left:auto;font:400 20px var(--display);font-style:normal;color:var(--berry)}
.wheel-wrap{position:relative;width:min(270px,68vw);aspect-ratio:1;max-width:100%;margin:12px auto 4px}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2;color:var(--berry);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);background:rgba(86,32,107,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:min(90vw,420px);text-align:center;box-sizing:border-box}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.topbar{gap:6px}.brand{font-size:19px}.iconbtn{width:37px;height:37px;font-size:18px}.pill{padding:6px 9px;font-size:14px;gap:4px}.hudbox{min-width:52px;padding:5px 7px}.hudbox.moves b{font-size:27px}.goal{font-size:17px}.goal img{width:25px;height:25px}.starbar{width:66px}.boost{width:50px;height:50px;font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="mapScreen" class="screen">
  <header class="topbar">
    <div class="brand">Candy Burst</div>
    <button class="pill" id="livesPill" aria-label="Lives">❤️ <b id="livesN">5</b> <small id="livesT">Full</small></button>
    <button class="iconbtn" id="wheelBtn" aria-label="Daily booster wheel">🎡<span class="dot hidden" id="wheelDot"></span></button>
    <button class="iconbtn" id="bagBtn" aria-label="Boosters">🎒</button>
    <button class="iconbtn" id="soundBtn" aria-label="Sound">🔊</button>
  </header>
  <div id="mapScroll"><div id="mapInner"><svg id="mapPath"></svg></div></div>
</div>

<div id="gameScreen" class="screen hidden">
  <div id="hud">
    <div class="hudbox moves" id="movesBox"><small>Moves</small><b id="movesN">0</b></div>
    <div class="hudbox goals" id="goalsBox"></div>
    <div class="hudbox score"><small>Score</small><b id="scoreN">0</b>
      <div class="starbar"><div id="starFill"></div><span class="mk" id="mk1">★</span><span class="mk" id="mk2">★</span><span class="mk" id="mk3" style="left:100%">★</span></div>
    </div>
  </div>
  <div id="lvLabel">LEVEL 1</div>
  <div id="boardWrap"><canvas id="board"></canvas><div id="bigText"></div></div>
  <div id="boosterBar">
    <button class="boost menu" id="menuBtn" aria-label="Pause">⏸</button>
    <button class="boost" data-b="hammer" aria-label="Lollipop hammer">🍭<i>0</i></button>
    <button class="boost" data-b="swap" aria-label="Free switch">🖐️<i>0</i></button>
    <button class="boost" data-b="shuffle" aria-label="Shuffle">🔀<i>0</i></button>
  </div>
</div>

<div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   Candy Burst — a match-3 game
   ========================================================= */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const now = () => performance.now();

/* ---------- save data ---------- */
const SAVE_KEY = 'candy-burst-save-v1';
const MAX_LIVES = 5, LIFE_MS = 20 * 60 * 1000;
const defSave = () => ({ unlocked: 1, stars: {}, best: {}, lives: MAX_LIVES, livesTs: Date.now(), boosters: { hammer: 3, swap: 3, shuffle: 3, bomb: 2, combo: 2, moves3: 2, plus5: 2 }, lastSpin: '', lastRefill: '', sound: true });
let S = loadSave();
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) { const d = defSave(); return Object.assign(d, s, { boosters: Object.assign(d.boosters, s.boosters || {}) }); } } catch (e) {}
  return defSave();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function tickLives() {
  if (S.lives >= MAX_LIVES) { S.livesTs = Date.now(); return; }
  const gained = Math.floor((Date.now() - S.livesTs) / LIFE_MS);
  if (gained > 0) { S.lives = Math.min(MAX_LIVES, S.lives + gained); S.livesTs = S.lives >= MAX_LIVES ? Date.now() : S.livesTs + gained * LIFE_MS; save(); }
}
function lifeTimer() {
  if (S.lives >= MAX_LIVES) return 'Full';
  const ms = Math.max(0, LIFE_MS - (Date.now() - S.livesTs));
  return Math.floor(ms / 60000) + ':' + String(Math.floor(ms % 60000 / 1000)).padStart(2, '0');
}
function loseLife() { tickLives(); if (S.lives >= MAX_LIVES) S.livesTs = Date.now(); S.lives = Math.max(0, S.lives - 1); save(); }

const BOOST = {
  hammer: { icon: '🍭', name: 'Lollipop Hammer', desc: 'Smash any one candy or blocker. No move used.' },
  swap: { icon: '🖐️', name: 'Free Switch', desc: 'Swap two neighbouring candies, even without a match.' },
  shuffle: { icon: '🔀', name: 'Shuffle', desc: 'Mix up every candy on the board.' },
  bomb: { icon: '💣', name: 'Color Bomb', desc: 'Start a level with a Color Bomb on the board.' },
  combo: { icon: '🎁', name: 'Striped + Wrapped', desc: 'Start a level with a Striped and a Wrapped candy.' },
  moves3: { icon: '👟', name: '+3 Moves', desc: 'Start a level with 3 extra moves.' },
  plus5: { icon: '⏱️', name: '+5 Moves', desc: 'Keep going when you run out of moves.' },
};

/* ---------- levels ----------
   map legend:  .  candy   #  no cell   j/J  jelly (1/2 layers)
                i/I frosting (1/2 layers)   l  licorice lock   c  chocolate          */
const R = (w, h) => Array(h).fill('.'.repeat(w));
const LEVELS = [
  { m: 15, n: 5, t: [900, 1800, 2800], g: [{ t: 'score' }], tip: 'Swap two neighbouring candies to line up 3 or more of the same kind.', map: R(7, 7) },
  { m: 18, n: 5, t: [3000, 6000, 9000], g: [{ t: 'score' }], tip: 'Match 4 in a row to make a Striped candy. It blasts a whole line!', map: R(8, 8) },
  { m: 20, n: 5, t: [3000, 6500, 10000], g: [{ t: 'jelly' }], tip: 'Clear all the jelly by making matches on top of it.', map: ['........', '........', '..jjjj..', '..jjjj..', '..jjjj..', '..jjjj..', '........', '........'] },
  { m: 20, n: 5, t: [3000, 6000, 9000], g: [{ t: 'col', c: 0, n: 15 }, { t: 'col', c: 4, n: 15 }], tip: 'Match in an L or T shape for a Wrapped candy. It explodes twice!', map: ['#......#', '........', '........', '........', '........', '........', '........', '#......#'] },
  { m: 22, n: 5, t: [6000, 11000, 16000], g: [{ t: 'ing', n: 2 }], tip: 'Bring the cherries and hazelnuts down to the green arrows at the bottom.', map: ['........', '........', '........', '...##...', '...##...', '........', '........', '........'] },
  { m: 24, n: 5, t: [8000, 16000, 24000], g: [{ t: 'jelly' }], tip: 'Match 5 in a row for a Color Bomb. Swap it with a candy to clear that whole color!', map: ['jjj..jjj', 'jJ....Jj', 'j......j', '........', '........', 'j......j', 'jJ....Jj', 'jjj..jjj'] },
  { m: 24, n: 5, t: [4000, 8000, 12000], g: [{ t: 'ice' }], tip: 'Frosting cracks when you make a match right next to it.', map: ['........', '.ii..ii.', '.ii..ii.', '........', '........', '.II..II.', '.II..II.', '........'] },
  { m: 24, n: 5, t: [5000, 10000, 15000], g: [{ t: 'jelly' }], tip: 'Licorice locks stop candies from moving. Match a locked candy to free it.', map: ['........', '..l..l..', '.jjjjjj.', 'l.jjjj.l', 'l.jjjj.l', '.jjjjjj.', '..l..l..', '........'] },
  { m: 28, n: 5, t: [3000, 7000, 11000], g: [{ t: 'choco' }], tip: 'Chocolate spreads every move you don\'t destroy any. Match next to it!', map: ['........', '........', '........', '........', '........', '...cc...', '..cccc..', '.cccccc.'] },
  { m: 25, n: 5, t: [3000, 6000, 9000], g: [{ t: 'sp', sp: 's', n: 4 }, { t: 'sp', sp: 'w', n: 2 }], tip: 'Fill the candy order by making special candies. Try swapping two specials together!', map: ['#......#', '........', '........', '........', '........', '........', '........', '#......#'] },

  if (Math.max(Math.abs(dx), Math.abs(dy)) < CS * .35) return;
  const c = drag.i % G.W + (Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0), r = ((drag.i / G.W) | 0) + (Math.abs(dx) > Math.abs(dy) ? 0 : Math.sign(dy));
  const from = drag.i; drag = null;
  if (inb(c, r)) { sel = null; trySwap(from, idx(c, r)); }
});
['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { drag = null; }));

document.querySelectorAll('.boost[data-b]').forEach(b => b.addEventListener('click', async () => {
  if (!G || G.busy || G.over) return;
  const k = b.dataset.b; if (!S.boosters[k]) return; sfx.click(); sel = null;
  if (k === 'hammer') { G.mode = G.mode === 'hammer' ? null : 'hammer'; G.free = false; if (G.mode) toast('Tap a candy or blocker to smash it'); }
  else if (k === 'swap') { G.free = !G.free; G.mode = null; if (G.free) toast('Swap any two neighbouring candies'); }
  else if (k === 'shuffle') { G.busy = true; G.mode = null; G.free = false; S.boosters.shuffle--; save(); updateBoostersUI(); clearHint(); await shuffleBoard('Shuffle!'); G.busy = false; G.lastAction = now(); }
  updateBoostersUI();
}));
$('#menuBtn').addEventListener('click', () => {
  if (!G) return; sfx.click();
  if (G.busy) { toast('Wait for the candies to settle'); return; }
  if (G.over) return;
  modal(`<h2>Paused</h2><p class="muted">Level ${G.n} · ${G.moves} moves left</p>
    <div class="col"><button class="btn big green" data-close>Resume</button>
    <button class="btn" id="pmRestart">Restart (−1 ❤️)</button>
    <button class="btn" id="pmQuit">Quit to map (−1 ❤️)</button>
    <button class="btn ghost" id="pmSound">${S.sound ? '🔊 Sound on' : '🔇 Sound off'}</button></div>`, c => {
    c.querySelector('#pmRestart').onclick = () => { const n = G.n; loseLife(); closeModal(); goMap(); if (S.lives > 0) preLevel(n); else toast('Out of lives! Wait for a refill.'); };
    c.querySelector('#pmQuit').onclick = () => { loseLife(); closeModal(); goMap(); };
    c.querySelector('#pmSound').onclick = e => { toggleSound(); e.target.textContent = S.sound ? '🔊 Sound on' : '🔇 Sound off'; };
  });
});

/* ---------- screens & map ---------- */
function showScreen(name) {
  curScreen = name;
  $('#mapScreen').classList.toggle('hidden', name !== 'map'); $('#gameScreen').classList.toggle('hidden', name !== 'game');
}
function goMap() { G = null; showScreen('map'); renderMap(); }
function starStr(n) { return [1, 2, 3].map(k => k <= n ? '<b>★</b>' : '<i>★</i>').join(''); }
function renderMap() {
  const inner = $('#mapInner'), N = LEVELS.length, gap = 100, h = N * gap + 240;
  inner.style.height = h + 'px';
  const w = inner.clientWidth || window.innerWidth, amp = Math.min(130, w / 2 - 60);
  const pts = []; for (let i = 0; i < N; i++) pts.push({ x: w / 2 + Math.sin(i * .95) * amp, y: h - 120 - i * gap });
  let d = `M${pts[0].x},${pts[0].y + 60} L${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < N; i++) { const a = pts[i - 1], b = pts[i]; d += ` C${a.x},${a.y - gap / 2} ${b.x},${b.y + gap / 2} ${b.x},${b.y}`; }
  const svg = $('#mapPath'); svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(86,32,107,.3)" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#ff8cc0" stroke-width="20" stroke-linecap="butt" stroke-dasharray="14 14"/>`;
  inner.querySelectorAll('.node,.deco,.world-label').forEach(el => el.remove());
  let seed = 5; const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const decoKeys = ['0', '1w', '2', '3h', '4', '5', 'b', 'i1', 'i2', '1', '4v'];
  for (let k = 0; k < N * 0.9; k++) {
    const y = h - 80 - rand() * (h - 120), side = rand() < .5, x = side ? 10 + rand() * Math.max(10, w / 2 - amp - 70) : w - 50 - rand() * Math.max(10, w / 2 - amp - 70);
    const im = document.createElement('img'); im.className = 'deco'; im.src = icon(decoKeys[k % decoKeys.length]); im.alt = '';
    const sz = 30 + rand() * 26; im.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;transform:rotate(${(rand() - .5) * 60}deg)`; inner.appendChild(im);
  }
  WORLDS.forEach(wd => { const p = pts[wd.at - 1]; const el = document.createElement('div'); el.className = 'world-label'; el.textContent = wd.name; el.style.top = (p.y + 44) + 'px'; inner.appendChild(el); });
  pts.forEach((p, i) => {
    const n = i + 1, b = document.createElement('button');
    b.className = 'node' + (n > S.unlocked ? ' locked' : '') + (n === S.unlocked ? ' current' : '');
    b.style.left = p.x + 'px'; b.style.top = p.y + 'px'; b.setAttribute('aria-label', 'Level ' + n);
    b.innerHTML = `${n > S.unlocked ? '🔒' : n}${n <= S.unlocked && S.stars[n] ? `<span class="st">${starStr(S.stars[n])}</span>` : ''}`;
    b.onclick = () => { audio(); if (n > S.unlocked) { toast('Beat level ' + (n - 1) + ' to unlock this one'); return; } sfx.click(); preLevel(n); };
    inner.appendChild(b);
  });
  const cur = pts[Math.min(S.unlocked, N) - 1], sc = $('#mapScroll');
  sc.scrollTop = cur.y - sc.clientHeight / 2;
  updateTopbar();
}
function updateTopbar() {
  tickLives();
  $('#livesN').textContent = S.lives; $('#livesT').textContent = lifeTimer();
  $('#wheelDot').classList.toggle('hidden', S.lastSpin === new Date().toDateString());
  $('#soundBtn').textContent = S.sound ? '🔊' : '🔇';
}
setInterval(() => { if (curScreen === 'map') updateTopbar(); }, 1000);
function toggleSound() { S.sound = !S.sound; save(); updateTopbar(); if (S.sound) sfx.click(); }
$('#soundBtn').onclick = toggleSound;
function preLevel(n) {
  tickLives();
  const L = LEVELS[n - 1], pre = { bomb: false, combo: false, moves3: false };
  modal(`<span class="lvbadge">LEVEL ${n}</span>
    <div class="stars-big">${[1, 2, 3].map(k => `<span class="s ${k <= (S.stars[n] || 0) ? 'on' : ''}">★</span>`).join('')}</div>
    <h3>Goal</h3><div class="goal-list">${L.g.map(g => `<div class="gl">${goalIconHTML(g)}<span>${goalText(g, L)}</span></div>`).join('')}</div>
    <div class="meta">${L.m} moves · ★ ${L.t[0].toLocaleString()} · ★★ ${L.t[1].toLocaleString()} · ★★★ ${L.t[2].toLocaleString()}${S.best[n] ? '<br>Best score ' + S.best[n].toLocaleString() : ''}</div>
    ${L.tip ? `<p class="tip">💡 ${L.tip}</p>` : ''}
    <h3>Pick boosters</h3>
    <div class="prebo">${['bomb', 'combo', 'moves3'].map(b => `<button class="pb" data-b="${b}" aria-label="${BOOST[b].name}" ${S.boosters[b] ? '' : 'disabled'}><span>${BOOST[b].icon}</span><i>${S.boosters[b]}</i></button>`).join('')}</div>
    <div class="pblabel" id="pbl">Tap to use a booster this level</div>
    <div class="row"><button class="btn ghost" data-close>Back</button><button class="btn big green" id="playBtn" ${S.lives > 0 ? '' : 'disabled'}>${S.lives > 0 ? 'Play' : 'No lives · ' + lifeTimer()}</button></div>`, c => {
    c.querySelectorAll('.pb').forEach(b => b.onclick = () => { const k = b.dataset.b; pre[k] = !pre[k]; b.classList.toggle('on', pre[k]); c.querySelector('#pbl').textContent = BOOST[k].name + ': ' + BOOST[k].desc; sfx.click(); });
    c.querySelector('#playBtn').onclick = () => { tickLives(); if (S.lives <= 0) { toast('Out of lives! Wait for a refill.'); return; } sfx.click(); closeModal(); startLevel(n, pre); };
  });
}
$('#bagBtn').onclick = () => {
  sfx.click();
  modal(`<h2>Your boosters</h2><div class="bag">${Object.keys(BOOST).map(k => `<div><span>${BOOST[k].icon}</span><section><b>${BOOST[k].name}</b><p>${BOOST[k].desc}</p></section><em>×${S.boosters[k]}</em></div>`).join('')}</div>
    <p class="muted">Win more on the daily wheel and by getting 3 stars on a level.</p><div class="row"><button class="btn" data-close>Close</button></div>`);
};
$('#livesPill').onclick = () => {
  sfx.click(); tickLives();
  const today = new Date().toDateString(), canRefill = S.lives < MAX_LIVES && S.lastRefill !== today;
  modal(`<div class="bigemoji">${'❤️'.repeat(S.lives) || '💔'}</div><h2>${S.lives} of ${MAX_LIVES} lives</h2>
    <p>${S.lives >= MAX_LIVES ? 'Your lives are full. Go play!' : 'A new life every 20 minutes. Next one in ' + lifeTimer() + '.'}</p>
    <p class="muted">You lose a life when you fail or quit a level.</p>
    <div class="row">${canRefill ? '<button class="btn green" id="refill">Free daily refill</button>' : ''}<button class="btn ghost" data-close>Close</button></div>`, c => {
    const b = c.querySelector('#refill'); if (b) b.onclick = () => { S.lives = MAX_LIVES; S.lastRefill = today; save(); updateTopbar(); closeModal(); toast('Lives refilled! ❤️'); sfx.ing(); };
  });
};
const WHEEL = [{ b: 'hammer', n: 1 }, { b: 'shuffle', n: 2 }, { b: 'bomb', n: 1 }, { b: 'swap', n: 1 }, { b: 'plus5', n: 1 }, { b: 'combo', n: 1 }, { b: 'moves3', n: 2 }, { b: 'jackpot' }];
function drawWheel(cv) {
  const x = cv.getContext('2d'), R = cv.width / 2, N = WHEEL.length, cols = ['#ff5fa2', '#ffd23f', '#5ad1ff', '#7be07b', '#b38cff', '#ff9a3c', '#ff6b8b', '#3ee0c0'];
  x.clearRect(0, 0, cv.width, cv.height); x.save(); x.translate(R, R);
  for (let k = 0; k < N; k++) {
    const a0 = -Math.PI / 2 + k * 2 * Math.PI / N, a1 = a0 + 2 * Math.PI / N;
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R - 10, a0, a1); x.closePath(); x.fillStyle = cols[k]; x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 6; x.stroke();
    x.save(); x.rotate((a0 + a1) / 2); x.translate(R * .62, 0); x.rotate(Math.PI / 2);
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `${R * .2}px serif`;
    x.fillText(WHEEL[k].b === 'jackpot' ? '🎉' : BOOST[WHEEL[k].b].icon, 0, 0);
    x.font = `600 ${R * .085}px Fredoka, sans-serif`; x.fillStyle = '#fff'; x.fillText(WHEEL[k].b === 'jackpot' ? 'ALL!' : '×' + WHEEL[k].n, 0, R * .17);
    x.restore();
  }
  x.beginPath(); x.arc(0, 0, R - 6, 0, 7); x.strokeStyle = '#fff'; x.lineWidth = 10; x.stroke();
  x.beginPath(); x.arc(0, 0, R * .13, 0, 7); x.fillStyle = '#fff'; x.fill(); x.beginPath(); x.arc(0, 0, R * .08, 0, 7); x.fillStyle = '#ff3f8e'; x.fill();
  x.restore();
}
$('#wheelBtn').onclick = () => {
  audio(); sfx.click();
  const today = new Date().toDateString(), can = S.lastSpin !== today;
  modal(`<h2>Daily Booster Wheel</h2><div class="wheel-wrap"><div class="wheel-ptr">▼</div><canvas id="wheelC" width="540" height="540"></canvas></div>
    <p id="wheelMsg">${can ? 'One free spin every day!' : 'You already spun today. Come back tomorrow!'}</p>
    <div class="row"><button class="btn ghost" data-close>Close</button><button class="btn big" id="spinBtn" ${can ? '' : 'disabled'}>Spin!</button></div>`, c => {
    const cv = c.querySelector('#wheelC'); drawWheel(cv);
    c.querySelector('#spinBtn').onclick = e => {
      if (S.lastSpin === today) return; e.target.disabled = true; S.lastSpin = today; save(); updateTopbar();
      const k = rnd(WHEEL.length), rot = 360 * 6 - (k * 45 + 22.5) + (Math.random() - .5) * 30;
      cv.style.transition = 'transform 4.2s cubic-bezier(.15,.7,.2,1)'; cv.style.transform = `rotate(${rot}deg)`;
      let ticks = 0; const tk = setInterval(() => { sfx.spin(); if (++ticks > 30) clearInterval(tk); }, 130);
      setTimeout(() => {
        const prize = WHEEL[k];
        if (prize.b === 'jackpot') { Object.keys(BOOST).forEach(b => S.boosters[b]++); c.querySelector('#wheelMsg').innerHTML = '<b>JACKPOT!</b> One of every booster!'; }
        else { S.boosters[prize.b] += prize.n; c.querySelector('#wheelMsg').innerHTML = `You won <b>${BOOST[prize.b].icon} ${BOOST[prize.b].name} ×${prize.n}</b>!`; }
        save(); sfx.win();
      }, 4300);
    };
  });
};

window.addEventListener('resize', () => { if (curScreen === 'game') layout(); else renderMap(); });
updateTopbar();
renderMap();
</script>
