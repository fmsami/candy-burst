name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web assets and sync Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../candy-burst.apk

      - uses: actions/upload-artifact@v5
        with:
          name: candy-burst-apk
          path: candy-burst.apk
          if-no-files-found: error

      # One rolling release, so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/candy-burst.apk
      - name: Publish APK to the Android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android
          git push -f origin android
          notes="Download **candy-burst.apk** below on your Android phone, open it, and allow installing from that source when asked. Built from ${GITHUB_SHA::7}."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android candy-burst.apk --clobber
            gh release edit android --notes "$notes" --latest
          else
            gh release create android candy-burst.apk --title "Candy Burst for Android" --notes "$notes" --latest
          fi
